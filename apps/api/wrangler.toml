name = "tripcod-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
# account_id comes from the CLOUDFLARE_ACCOUNT_ID env var (GitHub secret) or `wrangler login`.
workers_dev = false

# ── Custom Domain ────────────────────────────────────────────────
# api.tripcod.com is dedicated to this Worker. Use a Worker Custom Domain
# instead of a route that depends on a separate proxied DNS origin record.
# This prevents Cloudflare 530 / error 1016 (Origin DNS error).
routes = [
  { pattern = "api.tripcod.com", custom_domain = true }
]

# ── KV Namespaces ────────────────────────────────────────────────
[[kv_namespaces]]
binding    = "SESSIONS_KV"
id         = "ed57be2d93c14e8e8362d3c7c074b289"
preview_id = "ed57be2d93c14e8e8362d3c7c074b289"

[[kv_namespaces]]
binding    = "TENANT_CACHE_KV"
id         = "80e6bb7866794b1ea4eef2e1a4065040"
preview_id = "80e6bb7866794b1ea4eef2e1a4065040"

[[kv_namespaces]]
binding    = "FARE_CACHE_KV"
id         = "dc34e3df7ed3429bb6d08682303599f8"
preview_id = "dc34e3df7ed3429bb6d08682303599f8"

# ── R2 Buckets ───────────────────────────────────────────────────
[[r2_buckets]]
binding     = "DOCUMENTS_R2"
bucket_name = "tripcod-documents"

[[r2_buckets]]
binding     = "PUBLIC_ASSETS_R2"
bucket_name = "tripcod-public"

# ── Queues ───────────────────────────────────────────────────────
[[queues.producers]]
binding = "BOOKING_QUEUE"
queue   = "tripcod-bookings"

[[queues.producers]]
binding = "NOTIFY_QUEUE"
queue   = "tripcod-notifications"

[[queues.consumers]]
queue             = "tripcod-bookings"
max_batch_size    = 10
max_batch_timeout = 5
max_retries       = 3

[[queues.consumers]]
queue             = "tripcod-notifications"
max_batch_size    = 50
max_batch_timeout = 2

# ── Hyperdrive (Neon Postgres connection pooling at edge) ─────────
[[hyperdrive]]
binding = "HYPERDRIVE"
id      = "4cd8c2e342f4419590460c43c1b25943"

# ── Durable Objects (per-tenant rate limiter) ─────────────────────
[[durable_objects.bindings]]
name       = "TENANT_RATE_LIMITER"
class_name = "TenantRateLimiter"

# new_sqlite_classes required for free plan Durable Objects
[[migrations]]
tag                = "v1"
new_sqlite_classes = ["TenantRateLimiter"]

# ── Cron: fare-alert sweep (re-checks alert routes nobody searched lately) ──
[triggers]
crons = ["17 */4 * * *"]

# ── Environment Variables (non-secret) ───────────────────────────
[vars]
ENVIRONMENT          = "production"
PLATFORM_TENANT_SLUG = "tripcod"

# ── Secrets (set via `wrangler secret put <NAME>`) ────────────────
# DATABASE_URL, JWT_SECRET, RIYA_API_KEY, RIYA_API_SECRET, RIYA_API_BASE_URL,
# TRIPJACK_API_KEY, TRIPJACK_API_BASE_URL, TRIPJACK_PROXY_KEY, SERP_API_KEY, DUFFEL_API_KEY,
# RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
# NOMOD_API_KEY, NOMOD_API_SECRET, NOMOD_WEBHOOK_SECRET,
# RESEND_API_KEY,
# LEADVYNE_API_KEY, LEADVYNE_API_SECRET, LEADVYNE_BASE_URL,
# LEADVYNE_INSTANCE_ID, LEADVYNE_WEBHOOK_SECRET

