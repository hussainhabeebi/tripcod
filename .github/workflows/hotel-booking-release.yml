name: Hotel booking isolated release (D1 migration + API + web)

# Releases PR #13 + PR #14 (merge 92e60fd): D1 migration (tripcod-hotels), then
# tripcod-api, then tripcod-web. No Neon migration, other Worker, secret or setting.
# Preflight is read-only; the release job runs only when every gate passes.

on:
  workflow_dispatch:
  push:
    branches: [release/hotel-booking]
    paths: [.github/workflows/hotel-booking-release.yml]

permissions:
  contents: read

concurrency:
  group: tripcod-hotel-booking-release
  cancel-in-progress: false

env:
  RELEASE_COMMIT: 92e60fd11791ecabcb4471ab40489cce823670b9
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preflight:
    name: Read-only preflight (code, backup, database, rollback targets, baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go:          ${{ steps.gate.outputs.go }}
      bookmark:    ${{ steps.d1.outputs.bookmark }}
      api_version: ${{ steps.cf.outputs.api_version }}
      web_version: ${{ steps.cf.outputs.web_version }}
      city_sha:    ${{ steps.cf.outputs.city_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gate — application code is exactly the merged PR #13
        run: |
          git cat-file -e "$RELEASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git diff --exit-code "$RELEASE_COMMIT" HEAD -- apps packages pnpm-lock.yaml
          git diff --name-only "$RELEASE_COMMIT" HEAD
          echo "PINNED_OK"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Gate — typecheck and hotel / supplier regression tests
        run: |
          pnpm --filter @tripcod/api typecheck
          node --import ./node_modules/.pnpm/tsx@4.23.12/node_modules/tsx/dist/loader.mjs --test \
            apps/api/test/hotel-orders.test.ts apps/api/test/hotel-orders-d1.test.ts apps/api/test/hotel-validation.test.ts apps/api/test/hotel-city-sync.test.ts
          node --test packages/suppliers/test/*.test.cjs apps/tripjack-gateway/test/*.test.mjs

      - name: Gate — D1 backup / recovery (Time Travel) and empty target
        id: d1
        working-directory: apps/api
        run: |
          set -o pipefail
          grep -q 'database_id    = "e07a176a-f724-4769-9e0b-26250d23dea2"' wrangler.toml
          pnpm exec wrangler d1 time-travel info tripcod-hotels --json | tee tt.json
          bookmark=$(python3 -c "import json;print(json.load(open('tt.json'))['bookmark'])")
          [ -n "$bookmark" ] || { echo "BLOCKER: no D1 Time Travel bookmark"; exit 1; }
          echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
          pnpm exec wrangler d1 execute tripcod-hotels --remote --json --command "SELECT name FROM sqlite_master WHERE type = 'table'" | tee tables.json
          pnpm exec wrangler d1 migrations list tripcod-hotels --remote | tee pending.txt
          echo "BACKUP_VERIFIED (D1 Time Travel restore point $bookmark)"

      - name: Gate — database state (read-only session)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          sudo apt-get install -y postgresql-client >/dev/null 2>&1 || true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          SELECT 'read_only=' || current_setting('transaction_read_only');
          SELECT 'neon_hotel_bookings_table=' || (to_regclass('public.hotel_bookings') IS NOT NULL) || ' (expected false: hotel orders live in D1)';
          SELECT 'tenants=' || (to_regclass('public.tenants') IS NOT NULL) || ' users=' || (to_regclass('public.users') IS NOT NULL) || ' wallet_transactions=' || (to_regclass('public.wallet_transactions') IS NOT NULL);
          SELECT 'bookings_rows=' || count(*) FROM bookings;
          SELECT 'payments_rows=' || count(*) FROM payments;
          SQL

      - name: Gate — rollback targets (current API and web versions)
        id: cf
        shell: python
        run: |
          import json, os, urllib.request
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def get(path):
              r = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
              with urllib.request.urlopen(r, timeout=60) as res: v = json.load(res)
              if not v.get("success"): raise SystemExit("BLOCKER: Cloudflare read failed for " + path)
              return v["result"]
          out = {}
          for worker, name in (("tripcod-api", "api_version"), ("tripcod-web", "web_version")):
              versions = get(f"/workers/scripts/{worker}/deployments")["deployments"][0]["versions"]
              if len(versions) != 1 or versions[0]["percentage"] != 100:
                  raise SystemExit(f"BLOCKER: {worker} is on a split deployment; rollback target is ambiguous.")
              vid = versions[0]["version_id"]
              get(f"/workers/scripts/{worker}/versions/{vid}")   # the rollback version must exist
              out[name] = vid
              print(json.dumps({"worker": worker, "rollbackVersion": vid}))
          # Hotel city catalogue checkpoint (282k+ cities) — compared again after the release.
          import hashlib
          r = urllib.request.Request(base + "/r2/buckets/tripcod-documents/objects/hotel-static/city-regions.partial.json", headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
          out["city_sha"] = hashlib.sha256(urllib.request.urlopen(r, timeout=60).read()).hexdigest()
          print(json.dumps({"cityCheckpointSha256": out["city_sha"]}))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items(): f.write(f"{k}={v}\n")

      - name: Baseline — current production hotel search (read-only, before release)
        run: |
          IN=$(date -u -d '+30 days' +%F); OUT=$(date -u -d '+32 days' +%F)
          curl -sS -m 90 -A "Mozilla/5.0 (tripcod-release-check)" -o baseline.json -w "baseline_http=%{http_code}\n" \
            -H 'Content-Type: application/json' -H 'x-tenant-slug: tripcod' https://api.tripcod.com/api/hotels/search \
            -d "{\"cityCode\":\"DXB\",\"checkIn\":\"$IN\",\"checkOut\":\"$OUT\",\"rooms\":[{\"adults\":1,\"children\":0}],\"nationality\":\"IN\",\"currency\":\"INR\"}" || true
          python3 -c "import json;d=json.load(open('baseline.json'));print(json.dumps({'hotels':len(d.get('hotels',[])),'errorCode':d.get('errorCode'),'error':str(d.get('error',''))[:200]}))" 2>/dev/null || head -c 300 baseline.json

      - name: All gates passed
        id: gate
        run: echo "go=true" >> "$GITHUB_OUTPUT"

  release:
    name: D1 migration → API → web, with verification and rollback
    needs: preflight
    if: needs.preflight.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_ROLLBACK: ${{ needs.preflight.outputs.api_version }}
      WEB_ROLLBACK: ${{ needs.preflight.outputs.web_version }}
      CITY_SHA:     ${{ needs.preflight.outputs.city_sha }}
      D1_BOOKMARK:  ${{ needs.preflight.outputs.bookmark }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Release helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/cf.py" <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def call(path, payload=None):
              r = urllib.request.Request(base + path, data=None if payload is None else json.dumps(payload).encode(), method="GET" if payload is None else "POST",
                  headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=60) as res: v = json.load(res)
              except urllib.error.HTTPError as e: raise SystemExit(f"Cloudflare {path}: HTTP {e.code}")
              if not v.get("success"): raise SystemExit(f"Cloudflare {path} failed")
              return v["result"]
          def serving(worker): return call(f"/workers/scripts/{worker}/deployments")["deployments"][0]["versions"]
          def bindings(v): return sorted(json.dumps(b, sort_keys=True) for b in v["resources"].get("bindings", []))
          def activate(worker, vid, note):
              call(f"/workers/scripts/{worker}/deployments", {"strategy": "percentage", "versions": [{"version_id": vid, "percentage": 100}], "annotations": {"workers/message": note}})
              print(json.dumps({"activated": worker, "version": vid}))
          mode, worker = sys.argv[1], sys.argv[2]
          if mode == "unchanged":       # serving version is still the recorded rollback target
              if serving(worker) != [{"version_id": sys.argv[3], "percentage": 100}]: raise SystemExit(f"STOP: {worker} deployment moved since preflight")
              print(f"{worker} unchanged")
          elif mode == "activate":      # compare uploaded version to the serving one, then activate
              new = re.search(r"Worker Version ID:\s*([0-9a-f-]{36})", open(sys.argv[3]).read())
              if not new: raise SystemExit("STOP: uploaded version ID missing; nothing activated")
              old_v, new_v = call(f"/workers/scripts/{worker}/versions/{sys.argv[4]}"), call(f"/workers/scripts/{worker}/versions/{new[1]}")
              added = sorted(set(bindings(new_v)) - set(bindings(old_v))); removed = sorted(set(bindings(old_v)) - set(bindings(new_v)))
              allowed = [b for b in added if json.loads(b).get("type") == "d1" and json.loads(b).get("name") == "HOTEL_DB"]
              if removed or added != allowed or (worker == "tripcod-api" and len(allowed) not in (0, 1)) or (worker != "tripcod-api" and added):
                  raise SystemExit(f"STOP: binding differences beyond HOTEL_DB (added={added}, removed={removed}); nothing activated")
              print(json.dumps({"bindingsAdded": [json.loads(b).get("name") for b in added], "bindingsRemoved": []}))
              o, n = old_v["resources"].get("script_runtime", {}), new_v["resources"].get("script_runtime", {})
              for k in ("compatibility_date", "compatibility_flags", "migration_tag", "limits"):
                  if o.get(k) != n.get(k): raise SystemExit(f"STOP: runtime {k} differs ({o.get(k)} → {n.get(k)}); nothing activated")
              activate(worker, new[1], "Hotel booking release (PR #13); no other change")
              open(os.environ["GITHUB_ENV"], "a").write(f"{worker.upper().replace('-', '_')}_NEW={new[1]}\n")
          elif mode == "rollback":
              activate(worker, sys.argv[3], "Rollback: restore pre-hotel-booking version")
          PY

      - name: Re-check rollback targets are still serving
        run: |
          python3 "$RUNNER_TEMP/cf.py" unchanged tripcod-api "$API_ROLLBACK"
          python3 "$RUNNER_TEMP/cf.py" unchanged tripcod-web "$WEB_ROLLBACK"

      - name: Neon flight data counts before release (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          sudo apt-get install -y postgresql-client >/dev/null 2>&1 || true
          psql "$DATABASE_URL" -At -c "SELECT 'bookings=' || (SELECT count(*) FROM bookings) || ' payments=' || (SELECT count(*) FROM payments);" | tee "$RUNNER_TEMP/neon-before.txt"

      - name: D1 migration only (tripcod-hotels; Time Travel restore point recorded)
        working-directory: apps/api
        run: |
          set -o pipefail
          echo "D1 restore point (Time Travel bookmark): $D1_BOOKMARK"
          pnpm exec wrangler d1 migrations apply tripcod-hotels --remote
          pnpm exec wrangler d1 execute tripcod-hotels --remote --json --command "SELECT (SELECT count(*) FROM pragma_table_info('hotel_bookings')) AS cols, (SELECT count(*) FROM sqlite_master WHERE type = 'index' AND tbl_name = 'hotel_bookings' AND name LIKE 'hotel_%') AS idx, (SELECT count(*) FROM hotel_bookings) AS rows_" | tee d1.json
          python3 - <<'PY'
          import json
          r = json.load(open("d1.json"))[0]["results"][0]
          print(r)
          if (r["cols"], r["idx"]) != (35, 3): raise SystemExit("STOP: D1 hotel_bookings schema is not as expected")
          PY
          echo D1_MIGRATION_OK

      - name: API — upload non-serving version, verify, activate
        working-directory: apps/api
        run: |
          set -o pipefail
          pnpm --filter @tripcod/api typecheck
          cp wrangler.toml wrangler.hotel-booking.toml
          printf '\n[limits]\ncpu_ms = 30000\n' >> wrangler.hotel-booking.toml
          pnpm exec wrangler versions upload --config wrangler.hotel-booking.toml --keep-vars --message "Hotel booking PR #13" 2>&1 | tee "$RUNNER_TEMP/api.log"
          python3 "$RUNNER_TEMP/cf.py" activate tripcod-api "$RUNNER_TEMP/api.log" "$API_ROLLBACK"

      - name: API — verify (read-only; no booking, no payment)
        id: api_check
        run: |
          set -u; sleep 15
          api() { curl -sS -m 90 -A "Mozilla/5.0 (tripcod-release-check)" -H 'Content-Type: application/json' -H 'x-tenant-slug: tripcod' -o "$1" -w "%{http_code}" "${@:2}"; }
          IN=$(date -u -d '+30 days' +%F); OUT=$(date -u -d '+32 days' +%F)
          fail=0
          [ "$(api h.json https://api.tripcod.com/health)" = 200 ] || { echo "health failed"; fail=1; }
          c=$(api mine.json https://api.tripcod.com/api/hotels/orders/mine); echo "orders/mine (no sign-in) → $c"; [ "$c" = 401 ] || fail=1
          c=$(api ord.json https://api.tripcod.com/api/hotels/orders -X POST -d '{"bookingId":"RELEASECHECK0","mode":"INSTANT","contactEmail":"release@tripcod.com","contactPhone":"9999999999","rooms":[{"guests":[{"title":"Mr","firstName":"Release","lastName":"Check","type":"ADULT"}]}]}')
          echo "orders without a review → $c $(head -c 160 ord.json)"; [ "$c" = 410 ] || fail=1
          c=$(api bad.json https://api.tripcod.com/api/hotels/search -X POST -d "{\"cityCode\":\"DXB\",\"checkIn\":\"$IN\",\"checkOut\":\"$OUT\",\"rooms\":[{\"adults\":2,\"children\":2,\"childAge\":[5]}],\"nationality\":\"IN\",\"currency\":\"INR\"}")
          echo "child without an age → $c"; [ "$c" = 400 ] || fail=1
          c=$(api s.json https://api.tripcod.com/api/hotels/search -X POST -d "{\"cityCode\":\"DXB\",\"checkIn\":\"$IN\",\"checkOut\":\"$OUT\",\"rooms\":[{\"adults\":2,\"children\":2,\"childAge\":[4,9]},{\"adults\":3,\"children\":1,\"childAge\":[7]},{\"adults\":2,\"children\":1,\"childAge\":[1]}],\"nationality\":\"IN\",\"currency\":\"INR\"}")
          python3 - "$c" <<'PY' || true
          import json, sys
          d = json.load(open("s.json")) if open("s.json").read(1) == "{" else {}
          print(json.dumps({"roomWiseSearchHttp": sys.argv[1], "hotels": len(d.get("hotels", [])), "errorCode": d.get("errorCode"), "error": str(d.get("error", ""))[:200]}))
          PY
          # 5xx from our own code (not a supplier error code) means the release broke search.
          if [ "${c:0:1}" = 5 ] && ! grep -q '"errorCode"' s.json; then echo "search crashed"; fail=1; fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          [ "$fail" = 0 ] && echo API_VERIFIED

      - name: Web — build, upload non-serving version, verify, activate
        if: steps.api_check.outputs.fail == '0'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.tripcod.com
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
          pnpm exec wrangler versions upload --keep-vars --message "Hotel booking PR #13" 2>&1 | tee "$RUNNER_TEMP/web.log"
          python3 "$RUNNER_TEMP/cf.py" activate tripcod-web "$RUNNER_TEMP/web.log" "$WEB_ROLLBACK"

      - name: Web — page checks and browser journey (stops before booking / payment)
        id: web_check
        if: steps.api_check.outputs.fail == '0'
        run: |
          sleep 20
          fail=0
          IN=$(date -u -d '+30 days' +%F); OUT=$(date -u -d '+32 days' +%F)
          for p in / /hotels "/hotels/search?city=DXB&cityName=Dubai&checkIn=$IN&checkOut=$OUT&occ=2_4_9-3_7-2_1&currency=INR&nationality=IN" /hotels/hotel /hotels/book /trips /search; do
            c=$(curl -sS -m 90 -A "Mozilla/5.0 (tripcod-release-check)" -o page.html -w "%{http_code}" "https://www.tripcod.com$p"); echo "$c $p"
            [ "$c" = 200 ] || fail=1
          done
          curl -sS -m 30 -A "Mozilla/5.0" https://www.tripcod.com/hotels | grep -q "Rooms &amp; guests\|Rooms & guests" && echo "room-wise picker live" || { echo "room-wise picker missing"; fail=1; }
          mkdir -p "$RUNNER_TEMP/pw" && (cd "$RUNNER_TEMP/pw" && npm i --silent playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1)
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node .github/release/hotel-journey.cjs "$IN" "$OUT" || echo "JOURNEY_NOT_COMPLETED (see log above)"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          [ "$fail" = 0 ]

      - name: Hotel catalogue and flight data unchanged
        if: always() && steps.api_check.outcome != 'skipped'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          psql "$DATABASE_URL" -At -c "SELECT 'bookings=' || (SELECT count(*) FROM bookings) || ' payments=' || (SELECT count(*) FROM payments);" | tee neon-after.txt
          cmp -s neon-after.txt "$RUNNER_TEMP/neon-before.txt" && echo "NEON_FLIGHT_DATA_UNCHANGED" || echo "NOTE: Neon counts moved during the release (live traffic) — compare: $(cat "$RUNNER_TEMP/neon-before.txt")"
          (cd apps/api && pnpm exec wrangler d1 execute tripcod-hotels --remote --json --command "SELECT count(*) AS hotel_orders FROM hotel_bookings")
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          r = urllib.request.Request(base + "/r2/buckets/tripcod-documents/objects/hotel-static/city-regions.partial.json", headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
          data = urllib.request.urlopen(r, timeout=60).read()
          sha = hashlib.sha256(data).hexdigest()
          print(json.dumps({"cityCheckpointSha256": sha, "unchangedSincePreflight": sha == os.environ["CITY_SHA"]}))
          PY

      - name: Roll back API and web together on any failure
        if: failure() || steps.api_check.outputs.fail == '1' || steps.web_check.outputs.fail == '1'
        run: |
          python3 "$RUNNER_TEMP/cf.py" rollback tripcod-api "$API_ROLLBACK"
          if [ -n "${TRIPCOD_WEB_NEW:-}" ]; then python3 "$RUNNER_TEMP/cf.py" rollback tripcod-web "$WEB_ROLLBACK"; fi
          echo "ROLLED_BACK. D1 hotel_bookings stays (new database, unused by the previous versions); full D1 restore point: $D1_BOOKMARK"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotel-release-evidence
          path: |
            release-shots/
          if-no-files-found: ignore
