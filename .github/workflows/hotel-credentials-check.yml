name: Hotel credentials check (read-only)

# Read-only: where a copy of the original TripJack UAT key (the key hotel calls
# used successfully until 2026-10-28) still exists. Keys are compared and shown
# only as sha256 fingerprints (public logs). Nothing is written, no request is
# sent to TripJack, and no setting or secret is changed.
on:
  push:
    branches: [verify/hotel-credentials]
    paths: [.github/workflows/hotel-credentials-check.yml, .github/release/hotel-credentials-run.txt]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  TENANT_ID: 4c86636b-fb0a-4948-92ff-d62d602642b8
  UAT_FP: 48deb2d993fb      # original UAT key (hotel calls 200 until 2026-10-28)
  PROD_FP: 774b0016771e     # Production key now saved in Admin (flights)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look for the original UAT key (fingerprints only)
        shell: python
        run: |
          import hashlib, json, os, subprocess, urllib.parse, urllib.request
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          UAT, PROD = os.environ["UAT_FP"], os.environ["PROD_FP"]
          def get(p, raw=False):
              r = urllib.request.Request(base + p, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
              with urllib.request.urlopen(r, timeout=60) as res: return res.read() if raw else json.load(res)
          def fp(k): return hashlib.sha256(k.encode()).hexdigest()[:12] if isinstance(k, str) and k else ""
          def label(k):
              f = fp(k); return "ORIGINAL_UAT_KEY" if f == UAT else "PRODUCTION_KEY" if f == PROD else ("other:" + f if f else "(none)")
          def keys_in(obj, path=""):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if isinstance(v, str) and k.lower() in ("apikey", "hotelapikey", "api_key"): yield path + k, v
                      else: yield from keys_in(v, path + k + ".")
              elif isinstance(obj, list):
                  for i, v in enumerate(obj): yield from keys_in(v, path + str(i) + ".")

          print("1. tripcod-api Worker secrets (Cloudflare never returns secret values; names only):")
          secrets = get("/workers/scripts/tripcod-api/secrets")["result"]
          print("   ", sorted(s["name"] for s in secrets if "TRIPJACK" in s["name"]))

          print("2. Admin settings in TENANT_CACHE_KV (every tenant, TripJack + tenant caches):")
          ns = "/storage/kv/namespaces/80e6bb7866794b1ea4eef2e1a4065040"
          names, cursor = [], ""
          while True:
              page = get(ns + "/keys?limit=1000" + ("&cursor=" + cursor if cursor else ""))
              names += [k["name"] for k in page["result"]]
              cursor = (page.get("result_info") or {}).get("cursor") or ""
              if not cursor: break
          hits = [n for n in names if "tripjack" in n.lower() or n.startswith("tenant:")]
          print("    keys scanned:", len(hits), "of", len(names))
          for n in hits:
              try: v = json.loads(get(ns + "/values/" + urllib.parse.quote(n, safe=""), raw=True))
              except Exception: continue
              for path, k in keys_in(v):
                  print("   ", n.split(":")[0] + ":" + ("<tenant>" if os.environ["TENANT_ID"] in n else "…") + ":" + n.split(":")[-1], path, label(k))

          print("3. Neon tenant_supplier_configs.credentials (TRIPJACK rows):")
          out = subprocess.run(["psql", os.environ["DATABASE_URL"], "-At", "-c",
              "select tenant_id = '%s', coalesce(credentials::text,'null') from tenant_supplier_configs where supplier::text = 'TRIPJACK'" % os.environ["TENANT_ID"]],
              capture_output=True, text=True, env={**os.environ, "PGOPTIONS": "-c default_transaction_read_only=on"}).stdout
          rows = [l.split("|", 1) for l in out.splitlines() if l]
          print("    rows:", len(rows))
          for mine, cred in rows:
              try: c = json.loads(cred)
              except Exception: c = None
              found = list(keys_in(c)) if isinstance(c, (dict, list)) else []
              print("    thisTenant=%s credentials=%s %s" % (mine == "t", "null" if c is None else "set", [(p, label(k)) for p, k in found] or ("(encrypted/opaque)" if c else "")))

          print("4. Raw hotel request logs in R2 (certification copies of what was sent):")
          out = subprocess.run(["psql", os.environ["DATABASE_URL"], "-At", "-c",
              "select request_key from supplier_exchanges where tenant_id='%s' and http_status=200 and (endpoint like '/hms/%%' or endpoint like '/oms/v3/hotel/%%') order by started_at desc limit 3" % os.environ["TENANT_ID"]],
              capture_output=True, text=True, env={**os.environ, "PGOPTIONS": "-c default_transaction_read_only=on"}).stdout
          for k in [l for l in out.splitlines() if l]:
              try: h = {a.lower(): b for a, b in json.loads(get("/r2/buckets/tripcod-documents/objects/" + urllib.parse.quote(k, safe=""), raw=True)).get("headers", {}).items()}
              except Exception: h = {}
              print("    successful hotel call log:", label(h.get("apikey", "")))
          print("Read-only check complete. Nothing was written or sent to TripJack.")
