name: Hotel credentials check (read-only)

# Read-only: which TripJack key Admin holds, which key the Worker actually sent
# on recent hotel and flight calls, and what TripJack answered. Keys are shown
# only as sha256 fingerprints (public logs); no request is sent to TripJack.
on:
  push:
    branches: [verify/hotel-credentials]
    paths: [.github/workflows/hotel-credentials-check.yml, .github/release/hotel-credentials-run.txt]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  TENANT_ID: 4c86636b-fb0a-4948-92ff-d62d602642b8

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gateway health / ready (public endpoints)
        run: for p in health ready; do echo "$p: $(curl -sS -m 20 https://proxy.tripcod.com/$p)"; done
      - name: Admin TripJack setting, Worker secret names, raw call logs (fingerprints only)
        shell: python
        run: |
          import hashlib, json, os, subprocess, urllib.parse, urllib.request
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def get(p, raw=False):
              r = urllib.request.Request(base + p, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
              with urllib.request.urlopen(r, timeout=60) as res: return res.read() if raw else json.load(res)["result"]
          fp = lambda k: ("sha256:" + hashlib.sha256(k.encode()).hexdigest()[:12] + " len=" + str(len(k))) if k else "(none)"
          print("tripcod-api TripJack secrets:", sorted(s["name"] for s in get("/workers/scripts/tripcod-api/secrets") if "TRIPJACK" in s["name"]))
          s = json.loads(get(f"/storage/kv/namespaces/80e6bb7866794b1ea4eef2e1a4065040/values/admin_settings:{os.environ['TENANT_ID']}:integration:tripjack", raw=True))
          print("Admin TripJack setting:", json.dumps({"enabled": s.get("enabled"), "environment": s.get("environment"),
              "baseUrlHost": urllib.parse.urlparse(s.get("baseUrl") or "").netloc, "apiKey": fp(s.get("apiKey") or ""),
              "hotelEnvironment": s.get("hotelEnvironment"), "hotelApiKey": fp(s.get("hotelApiKey") or "")}))
          def rows(where):
              sql = ("select to_char(started_at,'YYYY-MM-DD HH24:MI'), endpoint, coalesce(http_status::text,'-'), request_key, coalesce(response_key,'') "
                     f"from supplier_exchanges where tenant_id='{os.environ['TENANT_ID']}' and ({where}) order by started_at desc limit 12")
              out = subprocess.run(["psql", os.environ["DATABASE_URL"], "-At", "-F", "\t", "-c", sql], capture_output=True, text=True, check=True).stdout
              return [l.split("\t") for l in out.splitlines() if l]
          def obj(k):
              try: return get("/r2/buckets/tripcod-documents/objects/" + urllib.parse.quote(k, safe=""), raw=True).decode("utf-8", "replace")
              except Exception as e: return ""
          for label, where in (("HOTEL", "endpoint like '/hms/%' or endpoint like '/oms/v3/hotel/%' or endpoint like '/tj-main/%'"),
                               ("FLIGHT", "endpoint like '/fms/%' or endpoint like '/oms/v1/%' or endpoint like '/air-%'")):
              print(f"── recent {label} calls (newest first)")
              for at, ep, status, rk, sk in rows(where):
                  try: req = json.loads(obj(rk))
                  except Exception: req = {}
                  hdr = {k.lower(): v for k, v in (req.get("headers") or {}).items()}
                  u = urllib.parse.urlparse(req.get("url", ""))
                  msg = ""
                  if status != "200" and sk:
                      try:
                          b = json.loads(obj(sk)); e = b.get("error") if isinstance(b.get("error"), dict) else {}
                          msg = str(e.get("message") or (b.get("errors") or [{}])[0].get("message") or b.get("error") or "")[:120]
                      except Exception: msg = "(non-JSON)"
                  print(f"{at} {status:>4} {u.netloc}{ep} apikey={fp(hdr.get('apikey',''))} {msg}")
