name: PAN Hold versus Instant existing-log comparison (read only)
on:
  push:
    branches: [audit/hotel-pan-existing-logs]
    paths: [.github/workflows/hotel-pan-existing-logs.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read saved D1 orders and existing R2 exchanges only
        shell: python
        run: |
          import os,json,urllib.request,urllib.parse,hashlib,re
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          def cf(path,payload=None,raw=False):
           req=urllib.request.Request(base+path,data=None if payload is None else json.dumps(payload).encode(),method='GET' if payload is None else 'POST',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
           with urllib.request.urlopen(req,timeout=60) as response: data=response.read()
           if raw:return data.decode()
           result=json.loads(data)
           if not result.get('success'):raise RuntimeError('Read-only Cloudflare request failed')
           return result['result']
          settings=cf('/workers/scripts/tripcod-api/settings')
          binding=next(b for b in settings['bindings'] if b.get('name')=='HOTEL_DB')
          rows=cf('/d1/database/'+(binding.get('id') or binding.get('database_id'))+'/query',{'sql':'SELECT id,tenant_id,supplier_booking_id,mode,status,created_at,guests,hotel FROM hotel_bookings ORDER BY created_at DESC LIMIT 30'})[0]['results']
          root='/r2/buckets/tripcod-documents/objects'
          def get(key):return json.loads(cf(root+'/'+urllib.parse.quote(key,safe='/'),raw=True))
          def digest(value):return hashlib.sha256(str(value).strip().upper().encode()).hexdigest()[:12]
          for row in rows:
           prefix='api-logs/'+row['tenant_id']+'/booking-'+row['supplier_booking_id']+'/'
           result=cf(root+'?'+urllib.parse.urlencode({'prefix':prefix,'per_page':200}))
           objects=result if isinstance(result,list) else result.get('objects',result.get('items',[]))
           keys=[o.get('key',o.get('name','')) for o in objects]
           print(json.dumps({'booking':row['supplier_booking_id'],'mode':row['mode'],'savedStatus':row['status'],'createdAt':row['created_at'],'storedFiles':len(keys)}))
           for key in keys:
            if not key.endswith('request.json') or not re.search(r'hotel-(book|booking-details|review)-request',key):continue
            request=get(key);body=request.get('body') or {}
            responsekey=key[:-len('request.json')]+'response.json'
            response=get(responsekey) if responsekey in keys else {}
            status=response.get('status');errors=response.get('errors') or []
            if isinstance(response.get('error'),dict):errors=errors+[response['error']]
            report={'booking':row['supplier_booking_id'],'path':urllib.parse.urlparse(request.get('url','')).path,'at':key.split('/')[-1].split('-oms-')[0].split('-hms-')[0],'status':status,'errors':[{'code':e.get('errCode',e.get('code')),'message':re.sub(r'[A-Z]{5}[0-9]{4}[A-Z]','[PAN]',str(e.get('message','')))} for e in errors]}
            if report['path'].endswith('/book'):
             rooms=body.get('roomTravellerInfo',[])
             report.update({'topLevelFields':sorted(body),'paymentInfosPresent':'paymentInfos' in body,'paymentCount':len(body.get('paymentInfos') or []),'type':body.get('type'),'rooms':[]})
             saved=json.loads(row['guests'])
             for i,room in enumerate(rooms):
              guests=[]
              for j,g in enumerate(room.get('travellerInfo',[])):
               pan=g.get('pan','');sg=saved[i][j] if i<len(saved) and j<len(saved[i]) else {}
               guests.append({'position':[i,j],'fields':sorted(g),'title':g.get('ti'),'passengerType':g.get('pt'),'firstNameHash':digest(g.get('fN','')),'lastNameHash':digest(g.get('lN','')),'panPresent':bool(pan),'panLength':len(pan),'panFingerprint':digest(pan),'panMatchesOtherDocSample':pan=='BBBCB1111B','panMatchesDocumentationSample':pan=='AAACA1111A','panMatchesSaved':pan==sg.get('pan',''),'panUppercaseAndTrimmed':pan==pan.strip().upper()})
              report['rooms'].append(guests)
            if report['path'].endswith('/review'):
             option=response.get('option') or {}
             report.update({'panRequired':(option.get('compliance') or {}).get('panRequired'),'onholdAllowed':response.get('onholdAllowed')})
            print(json.dumps(report))
          
