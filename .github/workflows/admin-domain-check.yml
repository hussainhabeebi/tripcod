name: Admin domain / version check (read-only)

on:
  workflow_dispatch:
  push:
    branches: [verify/admin-domain]
    paths: [.github/workflows/admin-domain-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Which Cloudflare service serves admin.tripcod.com, and which version is live
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def get(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + path, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]}), timeout=60) as r: return json.load(r)
              except urllib.error.HTTPError as e: return {"success": False, "http": e.code}
          d = get("/workers/domains")
          print("WORKER_CUSTOM_DOMAINS", json.dumps([{k: x.get(k) for k in ("hostname", "service", "environment")} for x in d.get("result", []) if "tripcod" in str(x.get("hostname"))], indent=1) if d.get("success") else d)
          p = get("/pages/projects")
          print("PAGES_PROJECTS", json.dumps([{"name": x.get("name"), "domains": x.get("domains"), "latest": (x.get("latest_deployment") or {}).get("created_on"), "branch": ((x.get("latest_deployment") or {}).get("deployment_trigger") or {}).get("metadata", {}).get("branch")} for x in p.get("result", [])], indent=1) if p.get("success") else p)
          for w in ("tripcod-admin", "tripcod", "tripcod-web", "tripcod-portal"):
              dep = get(f"/workers/scripts/{w}/deployments")
              if not dep.get("success"): print(w, "no script / no access", dep.get("http")); continue
              top = dep["result"]["deployments"][:3]
              print("DEPLOYMENTS", w, json.dumps([{"created": x.get("created_on"), "source": x.get("source"), "versions": x.get("versions"), "message": (x.get("annotations") or {}).get("workers/message")} for x in top], indent=1))
      - name: What admin.tripcod.com actually serves (public assets only)
        run: |
          curl -sS -m 30 -A "Mozilla/5.0" -D - -o login.html https://admin.tripcod.com/login | grep -iE "^(server|cf-ray|x-opennext|x-nextjs|cache-control|age):" || true
          grep -o '/_next/static/[^"]*\.js' login.html | sort -u | head -40 > chunks.txt
          echo "chunks: $(wc -l < chunks.txt)"
          for c in $(cat chunks.txt); do curl -sS -m 30 "https://admin.tripcod.com$c" -o c.js; if grep -q "Hotel UAT certification logs" c.js; then echo "SECTION_FOUND_IN $c"; fi; done
          curl -sS -m 30 -o sl.html -w "supplier-logs page http=%{http_code} redirect=%{redirect_url}\n" https://admin.tripcod.com/supplier-logs
          grep -o '/_next/static/chunks/app/(dashboard)/supplier-logs/[^"]*\.js' sl.html | sort -u | head
