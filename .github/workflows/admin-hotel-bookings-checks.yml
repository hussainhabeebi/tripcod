name: Admin hotel bookings checks
on:
  push:
    branches: [codex/admin-hotel-bookings]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Types, D1, logs, hold expiry, flight certification and access regressions
        run: |
          pnpm --filter @tripcod/api typecheck
          pnpm --filter @tripcod/admin typecheck
          node --import ./node_modules/.pnpm/tsx@4.23.12/node_modules/tsx/dist/loader.mjs --test apps/api/test/hotel-orders-d1.test.ts apps/api/test/hotel-cert-logs.test.ts apps/api/test/hotel-hold-expiry.test.ts apps/api/test/certification-pack.test.ts apps/api/test/admin-access.test.ts
          node --test packages/suppliers/test/*.test.cjs
      - name: Build Admin
        run: pnpm --filter @tripcod/admin build
      - name: Bundle API without deployment or migrations
        working-directory: apps/api
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/api-build"
      - name: Install QA browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1 --ignore-scripts
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile UI (synthetic bookings and logs only)
        env:
          API_BASE_URL: http://127.0.0.1:9
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
          QA_OUTPUT: ${{ runner.temp }}/admin-hotel-qa
        run: |
          pnpm --filter @tripcod/admin start --hostname 127.0.0.1 --port 3003 > "$RUNNER_TEMP/admin.log" 2>&1 &
          admin_pid=$!
          trap 'kill "$admin_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do if curl -fsS -H 'Cookie: tripcod_admin_token=synthetic-admin' http://127.0.0.1:3003/bookings > /dev/null; then break; fi; sleep 1; done
          export CHROMIUM_PATH=$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')
          BASE_URL=http://127.0.0.1:3003 node apps/admin/test/browser/hotel-bookings.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-hotel-bookings-screenshots
          path: ${{ runner.temp }}/admin-hotel-qa
