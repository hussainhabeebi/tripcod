name: Deploy to Cloudflare

on:
  push:
    branches: [main]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-api:
    name: Deploy API Worker
    needs: migrate-db
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # lets the D1 step see whether the airport list changed
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter @tripcod/api typecheck
        working-directory: .
      # D1 is the primary database. Create it on first deploy, write its id into
      # wrangler.toml, apply schema migrations and load the airport list.
      - name: Prepare D1 (primary database)
        run: |
          set -euo pipefail
          DB_ID=$(pnpm exec wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="tripcod");process.stdout.write(db?db.uuid:"")})')
          if [ -z "$DB_ID" ]; then
            pnpm exec wrangler d1 create tripcod
            DB_ID=$(pnpm exec wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).find(d=>d.name==="tripcod").uuid)})')
          fi
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          pnpm exec wrangler d1 migrations apply tripcod --remote
          COUNT=$(pnpm exec wrangler d1 execute tripcod --remote --json --command "SELECT count(*) AS n FROM airports" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(String(JSON.parse(s)[0].results[0].n))})')
          if [ "$COUNT" = "0" ] || ! git diff --quiet HEAD~1 HEAD -- d1/seed/airports.sql 2>/dev/null; then
            echo "Loading airport list into D1 (currently $COUNT rows)"
            pnpm exec wrangler d1 execute tripcod --remote --file d1/seed/airports.sql
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  migrate-db:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check database configuration
        id: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL is required before deploying the social sign-in schema."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install psql client
        if: steps.database.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        if: steps.database.outputs.configured == 'true'
        run: |
          for f in packages/db/drizzle/migrations/*.sql; do
            echo "Applying $f..."
            psql "$DATABASE_URL" -f "$f" || echo "Warning: $f may already be applied, continuing..."
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Require social sign-in schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f packages/db/drizzle/migrations/0003_customer_social_signin.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.tripcod.com' }}
      - run: pnpm exec wrangler deploy

  deploy-portal:
    name: Deploy Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.tripcod.com' }}
      - run: pnpm exec wrangler deploy

  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.tripcod.com' }}
      - run: pnpm exec wrangler deploy
